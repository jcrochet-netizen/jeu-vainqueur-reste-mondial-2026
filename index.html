<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le vainqueur reste — Édition Mondial 2026</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="round-badge">
        <span id="round-number">1/36</span>
      </div>
    </header>

    <main id="duel" class="duel">
      <div class="card" id="card-left" data-side="left">
        <div class="card-inner">
          <div class="photo-wrap">
            <div class="placeholder" id="placeholder-left">
              <span class="initials">—</span>
            </div>
            <img id="img-left" src="" alt="" decoding="async" fetchpriority="high" />
            <div class="photo-overlay"></div>
          </div>
          <div class="card-body">
            <span class="card-tag">Joueur</span>
            <h2 id="name-left">—</h2>
            <button class="choose-btn" data-side="left">Je préfère</button>
          </div>
        </div>
      </div>

      <div class="vs">
        <span>VS</span>
      </div>

      <div class="card" id="card-right" data-side="right">
        <div class="card-inner">
          <div class="photo-wrap">
            <div class="placeholder" id="placeholder-right">
              <span class="initials">—</span>
            </div>
            <img id="img-right" src="" alt="" decoding="async" fetchpriority="high" />
            <div class="photo-overlay"></div>
          </div>
          <div class="card-body">
            <span class="card-tag">Adversaire</span>
            <h2 id="name-right">—</h2>
            <button class="choose-btn" data-side="right">Je préfère</button>
          </div>
        </div>
      </div>
    </main>

    <section id="recap-block" class="history-section">
      <div class="history-header">
        <h3>Ton résultat</h3>
        <div class="history-actions">
          <span class="download-label">Téléchargez ton résultat en :</span>
          <button id="download-img" class="ghost-btn" title="Télécharger en image">📷 Image</button>
          <button id="download-txt" class="ghost-btn" title="Télécharger en texte">📄 Texte</button>
        </div>
      </div>

      <div id="endscreen" class="endscreen hidden">
        <div class="champion">
          <div class="champion-left">
            <span class="trophy">🏆</span>
            <h2>Ton joueur préféré est…</h2>
          </div>
          <div class="champion-right">
            <div class="champion-photo">
              <div class="placeholder" id="placeholder-champion">
                <span class="initials">—</span>
              </div>
              <img id="champion-img" src="" alt="" />
            </div>
            <h3 id="champion-name">—</h3>
          </div>
        </div>
      </div>

      <ol id="history" class="history-list"></ol>
    </section>

    <div class="restart-wrap">
      <button id="restart-btn" class="primary-btn">Rejouer</button>
    </div>

    <section class="share-section">
      <div class="share-buttons">
        <button class="share-btn twitter" data-network="twitter">𝕏 / Twitter</button>
        <button class="share-btn facebook" data-network="facebook">Facebook</button>
        <button class="share-btn whatsapp" data-network="whatsapp">WhatsApp</button>
        <button class="share-btn copy" data-network="copy">Copier le lien</button>
      </div>
      <p id="share-toast" class="share-toast hidden">Lien copié !</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
